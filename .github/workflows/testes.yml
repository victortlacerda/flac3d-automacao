name: testes

on:
  push:
  pull_request:

jobs:
  regressao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências
        run: pip install numpy
      - name: Compatibilidade com o Python do FLAC3D
        run: python tests/compat36.py
      - name: Regressão por mock (sem FLAC3D)
        run: ./tests/regressao.sh
